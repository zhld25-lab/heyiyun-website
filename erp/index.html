<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恒达云电力工程ERP · 项目经营管理平台</title>
<link rel="stylesheet" href="css/erp.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1b5fe3">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="恒达云">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}</script>
</head>
<body>
<div class="app">
    <!-- 一级模块图标轨 -->
    <aside class="modrail" id="modRail"></aside>

    <!-- 二级模块菜单（分组手风琴） -->
    <aside class="sidebar" id="sidebar">
        <div class="sb-brand">
            <div class="sb-logo">恒</div>
            <div><b id="modName">经营管理</b><small>电力工程ERP</small></div>
        </div>
        <nav class="sb-nav" id="sbNav"></nav>
        <div class="sb-foot">v2.0 · 项目数字化经营平台</div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
        <header class="topbar">
            <button class="tb-toggle" id="tbToggle">☰</button>
            <div class="crumb"><b id="crumbTitle">经营看板</b><span id="crumbSub">数据总览</span></div>
            <div class="tb-search"><span class="ic">🔍</span><input id="globalSearch" placeholder="搜索菜单功能…"></div>
            <div class="tb-actions">
                <button class="tb-icon" id="bellBtn" title="证书到期预警">🔔<span class="dot" id="bellDot" style="display:none"></span></button>
                <button class="tb-icon" id="resetBtn" title="重置演示数据">↺</button>
                <button class="tb-icon" id="logoutBtn" title="退出登录">⏻</button>
                <div class="tb-user">
                    <div class="tb-avatar" id="userAvatar">管</div>
                    <div><div class="nm" id="userName">管理员</div><div class="rl" id="userRole">系统管理员</div></div>
                </div>
            </div>
        </header>
        <main class="page" id="page"></main>
    </div>

    <!-- 全局功能搜索下拉 -->
    <div id="searchPanel" class="search-panel"></div>

    <!-- 移动端：抽屉遮罩 + 底部Tab导航 -->
    <div class="nav-mask" id="navMask"></div>
    <nav class="tabbar" id="tabbar"></nav>
</div>
<script type="module" src="js/app.js?v=real2"></script>
</body>
</html>
